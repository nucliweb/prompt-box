[package]
name = "prompt-box"
version = "0.1.0"
edition = "2021"
description = "A lightweight CLI/TUI prompt manager for developers and AI agents"
license = "MIT"
repository = "https://github.com/nucliweb/prompt-box"
homepage = "https://github.com/nucliweb/prompt-box"
readme = "README.md"
keywords = ["cli", "tui", "prompt", "ai", "manager"]
categories = ["command-line-utilities"]

[[bin]]
name = "pbox"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
tempfile = "3"

[dependencies]
anyhow = "1"
chrono = "0.4"
arboard = "3"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "5"
fuzzy-matcher = "0.3"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
